# Publicerer trampolinspillet på GitHub Pages.
name: Trampolin på GitHub Pages

on:
  push:
    branches: [claude/walabers-trampoline-remake-q1fu0w]
    paths: ['trampoline/**', '.github/workflows/trampolin-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test trampoline/test/*.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: trampoline
      - id: deployment
        uses: actions/deploy-pages@v4
